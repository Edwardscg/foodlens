name: foodlens_mobileapp
description: "FoodLens — registro de comidas y estimación nutricional asistida por IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Gestión de estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^14.6.2

  # Cliente HTTP
  dio: ^5.7.0

  # Almacenamiento seguro de tokens
  flutter_secure_storage: ^9.2.2

  # Captura y compresión de fotos
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Formateo de fechas/números
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true