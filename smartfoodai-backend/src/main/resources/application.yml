spring:
  application:
    name: foodlens-backend
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
  jpa:
    hibernate:
      # "validate": Hibernate compara las entidades contra las tablas que ya
      # existen en Railway y falla claramente al arrancar si no coinciden.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 30
  gemini:
    api-key: ${GEMINI_API_KEY:}
  fdc:
    api-key: ${FDC_API_KEY:DEMO_KEY}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:}
